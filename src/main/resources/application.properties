spring.application.name=freecsfood-api
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/freecsfood?createDatabaseIfNotExist=true&serverTimezone=UTC}
spring.datasource.username=${DB_USERNAME:freecsfood}
spring.datasource.password=${DB_PASSWORD:}
spring.jpa.open-in-view=false
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=${JPA_SHOW_SQL:false}
spring.flyway.locations=classpath:db/migration
spring.jackson.deserialization.fail-on-unknown-properties=true
spring.jackson.deserialization.fail-on-ignored-properties=true
spring.mvc.problemdetails.enabled=true
spring.web.resources.add-mappings=false
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000}
